# sea-shell — Hyprland keybinds
# Uses tools you already have: kitty · fish · wpctl (pipewire) · brightnessctl.
# For screenshots install: grim slurp  ·  for clipboard: cliphist wl-clipboard.
# NB: all binds use `bindd` (bind-with-description) so the cheat-sheet (SUPER+K)
# shows real names AND can rebind keys — keep descriptions comma-free.

$mod = SUPER
$term = kitty
$menu = qs -c sea-shell ipc call launcher toggle   # native launcher, resident in the bar (instant)
$browser = xdg-open https://
# toggled launchers — press again to close, no stacking dupes (see sea-toggle.sh)
# settings is resident in the bar process; toggle it over IPC (instant, no spawn)
$settings = qs -c sea-shell ipc call settings toggle
$wallpick = ~/.config/quickshell/sea-shell/sea-toggle.sh wallpaper
$powermenu = ~/.config/quickshell/sea-shell/sea-toggle.sh power
$keybinds = ~/.config/quickshell/sea-shell/sea-toggle.sh keybinds
$shotmenu = ~/.config/quickshell/sea-shell/sea-toggle.sh screenshot
$dac = qs -c sea-shell ipc call dac toggle          # Moondrop DAC EQ panel (resident)

# ---------------- apps ----------------
bindd = $mod, T, Terminal, exec, $term
bindd = SUPER, q, Close window, killactive,
bindd = CTRL, Space, App launcher, exec, $menu
bindd = $mod, Space, App launcher, exec, $menu
bindd = $mod, E, File manager, exec, nautilus
bindd = SUPER, a, Browser, exec, $browser
bindd = $mod, S, Control center, exec, $settings
bindd = $mod SHIFT, E, Moondrop EQ, exec, $dac
bindd = $mod SHIFT, W, Wallpaper picker, exec, $wallpick
bindd = $mod, N, Next wallpaper, exec, ~/.config/quickshell/sea-shell/sea-wallpaper-cycle.sh next
bindd = $mod SHIFT, N, Previous wallpaper, exec, ~/.config/quickshell/sea-shell/sea-wallpaper-cycle.sh prev
bindd = $mod SHIFT, D, Toggle light/dark, exec, ~/.config/quickshell/sea-shell/sea-toggle-theme.sh
bindd = $mod, K, Keybind cheat-sheet, exec, $keybinds
bindd = $mod, Escape, Power menu, exec, $powermenu
bindd = $mod ALT, L, Lock screen, exec, ~/.config/quickshell/sea-shell/sea-lock.sh
bindd = $mod SHIFT, R, Reload Hyprland, exec, hyprctl reload
bindd = $mod SHIFT, B, Restart bar, exec, pkill -xf 'qs -c sea-shell'; qs -c sea-shell &

# ---------------- window switcher (alt-tab) ----------------
# hold ALT, press Tab to cycle a visual switcher of every open window; release ALT to
# focus the picked one. Escape cancels. Driven by the resident switcher in the bar.
bindd = ALT, Tab, Window switcher, exec, qs -c sea-shell ipc call switcher next
bindd = ALT SHIFT, Tab, Window switcher (back), exec, qs -c sea-shell ipc call switcher prev
bind  = ALT, Escape, exec, qs -c sea-shell ipc call switcher cancel
bindr = ALT, Alt_L, exec, qs -c sea-shell ipc call switcher commit

# ---------------- window management ----------------
bindd = $mod, F, Maximize, fullscreen, 1
bindd = $mod SHIFT, F, True fullscreen, fullscreen, 0
bindd = $mod, P, Toggle floating, togglefloating,
bindd = SUPER, c, Center window, centerwindow,

# focus (vim keys + arrows)
bindd = $mod, h, Focus left, movefocus, l
bindd = $mod, l, Focus right, movefocus, r
bindd = $mod, k, Focus up, movefocus, u
bindd = $mod, j, Focus down, movefocus, d
bindd = $mod, left,  Focus left, movefocus, l
bindd = $mod, right, Focus right, movefocus, r
bindd = $mod, up,    Focus up, movefocus, u
bindd = $mod, down,  Focus down, movefocus, d

# move windows
bindd = $mod SHIFT, h, Move window left, movewindow, l
bindd = $mod SHIFT, l, Move window right, movewindow, r
bindd = $mod SHIFT, k, Move window up, movewindow, u
bindd = $mod SHIFT, j, Move window down, movewindow, d

# resize (repeatable)
binded = $mod CTRL, h, Shrink width, resizeactive, -40 0
binded = $mod CTRL, l, Grow width, resizeactive, 40 0
binded = $mod CTRL, k, Shrink height, resizeactive, 0 -40
binded = $mod CTRL, j, Grow height, resizeactive, 0 40

# ---------------- workspaces (1–10) ----------------
bindd = $mod, 1, Workspace 1, workspace, 1
bindd = $mod, 2, Workspace 2, workspace, 2
bindd = $mod, 3, Workspace 3, workspace, 3
bindd = $mod, 4, Workspace 4, workspace, 4
bindd = $mod, 5, Workspace 5, workspace, 5
bindd = $mod, 6, Workspace 6, workspace, 6
bindd = $mod, 7, Workspace 7, workspace, 7
bindd = $mod, 8, Workspace 8, workspace, 8
bindd = $mod, 9, Workspace 9, workspace, 9
bindd = $mod, 0, Workspace 10, workspace, 10

# move active window to workspace
bindd = $mod SHIFT, 1, Send to workspace 1, movetoworkspace, 1
bindd = $mod SHIFT, 2, Send to workspace 2, movetoworkspace, 2
bindd = $mod SHIFT, 3, Send to workspace 3, movetoworkspace, 3
bindd = $mod SHIFT, 4, Send to workspace 4, movetoworkspace, 4
bindd = $mod SHIFT, 5, Send to workspace 5, movetoworkspace, 5
bindd = $mod SHIFT, 6, Send to workspace 6, movetoworkspace, 6
bindd = $mod SHIFT, 7, Send to workspace 7, movetoworkspace, 7
bindd = $mod SHIFT, 8, Send to workspace 8, movetoworkspace, 8
bindd = $mod SHIFT, 9, Send to workspace 9, movetoworkspace, 9
bindd = $mod SHIFT, 0, Send to workspace 10, movetoworkspace, 10

# cycle workspaces with the scroll wheel over the desktop
bindd = $mod, mouse_down, Next workspace, workspace, e+1
bindd = $mod, mouse_up,   Previous workspace, workspace, e-1

# special / scratchpad
bindd = $mod, grave, Scratchpad, togglespecialworkspace, scratch
bindd = $mod SHIFT, grave, Send to scratchpad, movetoworkspace, special:scratch

# ---------------- move/resize with the mouse ----------------
bindmd = $mod, mouse:272, Move window (mouse), movewindow
bindmd = $mod, mouse:273, Resize window (mouse), resizewindow

# ---------------- media & hardware keys ----------------
bindeld = , XF86AudioRaiseVolume, Volume up, exec, wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%+
bindeld = , XF86AudioLowerVolume, Volume down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindld  = , XF86AudioMute,        Mute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindld  = , XF86AudioMicMute,     Mic mute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindeld = , XF86MonBrightnessUp,   Brightness up, exec, brightnessctl set 5%+
bindeld = , XF86MonBrightnessDown, Brightness down, exec, brightnessctl set 5%-
bindld  = , XF86AudioPlay,  Play / pause, exec, playerctl play-pause
bindld  = , XF86AudioNext,  Next track, exec, playerctl next
bindld  = , XF86AudioPrev,  Previous track, exec, playerctl previous

# ---------------- screenshots (needs grim + slurp + wl-clipboard) ----------------
# plain Print → picker widget (monitor / region / window / all — closes itself before the shot)
bindd = , Print, Screenshot menu, exec, $shotmenu
# pin/unpin keeps open dropdowns (music player etc.) alive while slurp grabs focus
bindd = $mod, Print, Screenshot region, exec, pgrep -x slurp >/dev/null || { quickshell -c sea-shell ipc call shell pin; grim -g "$(slurp)" /tmp/sea-capture.png && quickshell -p ~/.config/quickshell/sea-shell/screenshot-editor.qml; }
bindd = $mod SHIFT, S, Screenshot region, exec, pgrep -x slurp >/dev/null || { quickshell -c sea-shell ipc call shell pin; grim -g "$(slurp)" /tmp/sea-capture.png && quickshell -p ~/.config/quickshell/sea-shell/screenshot-editor.qml; }

# ---------------- clipboard history (needs cliphist + wl-clipboard) ----------------
# SUPER+V opens the launcher in clipboard mode; the bar clipboard icon does the same.
bindd = $mod, V, Clipboard history, exec, qs -c sea-shell ipc call launcher clipboard
# ---------------- sea-shell 2.0 ----------------
bindd = $mod, W, Mission Control, exec, qs -c sea-shell ipc call shell toggleExpose
bindd = $mod, D, Dashboard, exec, ~/.config/quickshell/sea-shell/sea-toggle.sh Dashboard
# Opens the recorder chooser (what to capture · which audio · quality). While a
# recording is running the same key stops it instead — the panel decides, since it's
# the one that knows. Left-click the bar pill to stop, right-click twice to discard.
bindd = $mod, R, Screen Recording, exec, qs -c sea-shell ipc call recorder toggle

# ---------------- screen magnifier (Hyprland cursor:zoom_factor) ----------------
# SUPER +/- steps the zoom (hold to repeat), SUPER 0 resets. The level flashes in the OSD.
bindde = $mod, equal,      Magnifier zoom in,  exec, qs -c sea-shell ipc call zoom inc
bindde = $mod, minus,      Magnifier zoom out, exec, qs -c sea-shell ipc call zoom dec
bindde = $mod, KP_Add,     Magnifier zoom in,  exec, qs -c sea-shell ipc call zoom inc
bindde = $mod, KP_Subtract,Magnifier zoom out, exec, qs -c sea-shell ipc call zoom dec
bindd  = $mod, 0,          Magnifier reset,    exec, qs -c sea-shell ipc call zoom reset

bindd = SUPER, c, Code, exec, visual-studio-code-electron