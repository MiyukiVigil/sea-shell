# sea-shell — Hyprland look, themed after miyukivigil.tech
# Source this from your main config:  source = ~/Documents/personal/sea-shell/hypr/sea.conf
# Syntax targets Hyprland 0.55.x (rounding + shadow live under `decoration`).

general {
    gaps_in = 5
    gaps_out = 12
    border_size = 2
    # frost → iris gradient, 45° — the same gradient as the site logo/borders
    col.active_border = rgba(a2e2e8ee) rgba(63c7ddee) 45deg
    col.inactive_border = rgba(24304aaa)
    resize_on_border = true
}

decoration {
    rounding = 10                 # = --tile-radius: 10px
    active_opacity = 1.0
    inactive_opacity = 0.96

    blur {
        enabled = true            # = CSS backdrop-filter: blur()
        size = 9
        passes = 4
        new_optimizations = true
        vibrancy = 0.17
        popups = true             # frost the bar dropdowns so low opacity stays readable
        popups_ignorealpha = 0.2
    }

    shadow {
        enabled = true            # = the tile box-shadow glow
        range = 24
        render_power = 3
        color = rgba(63c7dd44)
        color_inactive = rgba(0a141e66)
    }
}

animations {
    enabled = true
    # the site's "tile-in" spring:  cubic-bezier(.34, 1.5, .58, 1)
    bezier = seatile, 0.34, 1.5, 0.58, 1
    # the page-enter ease:          cubic-bezier(.22, 1, .36, 1)
    bezier = seaease, 0.22, 1.0, 0.36, 1.0

    animation = windows,     1, 4, seatile, popin 84%
    animation = windowsOut,  1, 4, seaease, popin 84%
    animation = border,      1, 8, seaease
    animation = borderangle, 1, 30, seaease, loop
    animation = fade,        1, 5, seaease
    animation = workspaces,  1, 5, seatile, slide
}

# ---------------- autostart ----------------
# The bar's exec-once lives in the block install.sh writes into hyprland.conf
# (keeping it here too would launch two bars on login).
# NB: clipboard-history watchers are started by the bar itself (managed lifecycle),
# and the sea-shell bar runs its own notification daemon (popups + bar center),
# so do NOT also start mako/dunst — only one can own the notification bus.

# frost the sea-shell bar + its popups / overlays (matches the bar's backdrop blur)
# NB: Hyprland 0.55 rule syntax is `<field> <value>, match:<prop> <regex>`.
# ignore_alpha 0.2 keeps the blur off the fully-transparent parts of the layer
# surface (dropdowns are drawn inside a screen-sized transparent window).
layerrule = blur on, ignore_alpha 0.2, match:namespace sea-shell:bar
layerrule = blur on, ignore_alpha 0.2, match:namespace sea-shell:drop
layerrule = blur on, ignore_alpha 0.2, match:namespace sea-shell:notif
layerrule = blur on, ignore_alpha 0.2, match:namespace sea-shell:osd


# float the little wifi-password terminal in the centre
windowrule = float on, match:class ^(sea-wifi)$
windowrule = size 560 240, match:class ^(sea-wifi)$
windowrule = center on, match:class ^(sea-wifi)$
