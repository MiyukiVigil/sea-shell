# sea-shell — hypridle (installed to ~/.config/hypr/hypridle.conf)
# dim @ 2.5 min → lock @ 5 min → screen off @ 10 min → suspend @ 30 min
# Also makes `loginctl lock-session` (power menu / SUPER+ESC → Lock) actually lock.

general {
    lock_cmd = pidof hyprlock || hyprlock          # never stack a second locker
    before_sleep_cmd = loginctl lock-session       # lock BEFORE suspending
    # Lua dispatch form: under a Lua config (Hyprland 0.55+) `hyprctl dispatch dpms on` is run
    # as hl.dispatch(dpms on) and fails to parse, so the screen never blanked or woke
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'     # wake the screen after resume
}

# dim the backlight (restores on activity)
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 25%
    on-resume = brightnessctl -r
}

# lock the session
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# screen off (turns back on with input)
listener {
    timeout = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# suspend — comment this listener out on a desktop
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
