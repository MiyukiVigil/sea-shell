# sea-shell — hyprlock (installed to ~/.config/hypr/hyprlock.conf)
# Locks via `loginctl lock-session` (hypridle relays it to hyprlock) or plain `hyprlock`.
# Background is auto-synced from the active wallpaper via sea-lockwall.sh.

# ── default variables & fallbacks ────────────────────────────────────────────
$accent = rgba(63c7ddcc)
$accentAlpha = 63c7dd
$frost = rgba(a2e2e8ff)
$frostAlpha = a2e2e8
$font = sans-serif

source = ~/.config/hypr/sea-shell/hyprlock-colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

# ── wallpaper background ────────────────────────────────────────────────────
background {
    monitor =
    path = ~/.config/sea-shell/sea-lockwall.png
    color = rgba(0a0f1dff)

    blur_passes = 4
    blur_size = 7
    vibrancy = 0.2
    vibrancy_darkness = 0.35
    brightness = 0.55
    contrast = 0.95
}

# ── big clock ───────────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] date +'%H:%M'
    color = rgba(ffffffff)
    font_size = 94
    font_family = $font Bold
    shadow_passes = 3
    shadow_size = 5
    shadow_color = rgba(00000080)
    position = 0, 190
    halign = center
    valign = center
}

# ── date ────────────────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] date +'%A, %-d %B %Y'
    color = rgba(ffffffff)
    font_size = 18
    font_family = $font
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(00000080)
    position = 0, 106
    halign = center
    valign = center
}

# ── thin divider ─────────────────────────────────────────────────────────────
label {
    monitor =
    text =  ────────────────────────────────  
    color = rgba(ffffff44)
    font_size = 8
    font_family = $font
    position = 0, 62
    halign = center
    valign = center
}

# ── username above input ─────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:0] echo "$USER"
    color = rgba(ffffffcc)
    font_size = 14
    font_family = $font
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(00000080)
    position = 0, 18
    halign = center
    valign = center
}

# ── password input ──────────────────────────────────────────────────────────
input-field {
    monitor =
    size = 280, 50
    rounding = 12
    outline_thickness = 3

    outer_color = $accent
    inner_color = rgba(10, 15, 25, 0.7)
    font_color = rgba(255, 255, 255, 0.9)

    check_color = $frost
    fail_color  = rgba(f46e6e88)
    capslock_color = rgba(f5c18aee)

    placeholder_text = <span foreground="##$accentAlpha">enter password…</span>
    fail_text = <span foreground="##f46e6e"> wrong password ($ATTEMPTS)</span>

    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    fade_on_empty = false

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(00000066)

    position = 0, -40
    halign = center
    valign = center
}

# ── caps-lock warning ────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] hyprctl devices -j 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); caps=[kb.get('capsLock',False) for kb in d.get('keyboards',[])] ; print('  CAPS LOCK ON' if any(caps) else '')" 2>/dev/null || echo ""
    color = rgba(f5c18aee)
    font_size = 11
    font_family = $font
    position = 0, -104
    halign = center
    valign = center
}

# ── bottom hint ──────────────────────────────────────────────────────────────
label {
    monitor =
    text =   sea-shell
    color = rgba(ffffff44)
    font_size = 10
    font_family = $font
    position = 0, 20
    halign = center
    valign = bottom
}

# ── now playing (centered bottom) ────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] ~/.config/quickshell/sea-shell/sea-nowplaying.sh
    color = rgba(ffffffcc)
    font_size = 12
    font_family = $font
    position = 0, -160
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(000000a0)
}
