# sea-shell — hyprlock (installed to ~/.config/hypr/hyprlock.conf)
# Locks via `loginctl lock-session` (hypridle relays it to hyprlock) or plain `hyprlock`.
# Background is auto-synced from the active wallpaper via sea-lockwall.sh.

general {
    hide_cursor = true
    ignore_empty_input = true
}

# ── wallpaper background ────────────────────────────────────────────────────
background {
    monitor =
    path = ~/.config/sea-shell/sea-lockwall.png
    color = rgba(0d1420ff)

    blur_passes = 4
    blur_size = 7
    vibrancy = 0.18
    vibrancy_darkness = 0.4
    brightness = 0.6
    contrast = 0.9
}

# ── big clock ───────────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] date +'%H:%M'
    color = rgba(e2e9f4ff)
    font_size = 96
    font_family = monospace Bold
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(00000099)
    position = 0, 200
    halign = center
    valign = center
}

# ── date ────────────────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] date +'%A, %-d %B %Y'
    color = rgba(a6b6cfff)
    font_size = 17
    font_family = monospace
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(00000080)
    position = 0, 106
    halign = center
    valign = center
}

# ── thin divider ─────────────────────────────────────────────────────────────
label {
    monitor =
    text =  ──────────────────  
    color = rgba(6f809966)
    font_size = 10
    font_family = monospace
    position = 0, 62
    halign = center
    valign = center
}

# ── username above input ─────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:0] echo "$USER"
    color = rgba(c4cfe4e6)
    font_size = 13
    font_family = monospace
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(00000080)
    position = 0, 18
    halign = center
    valign = center
}

# ── password input ──────────────────────────────────────────────────────────
input-field {
    monitor =
    size = 320, 52
    rounding = 14
    outline_thickness = 2

    outer_color = rgba(63c7ddcc)
    inner_color = rgba(0d1420d1)
    font_color = rgba(e2e9f4ff)

    check_color = rgba(a2e2e8ff)
    fail_color  = rgba(f38ba8e6)
    capslock_color = rgba(f5c18ae6)

    placeholder_text = <span foreground="##6f8099">enter password…</span>
    fail_text = <span foreground="##f38ba8"> wrong password ($ATTEMPTS)</span>

    dots_size = 0.28
    dots_spacing = 0.22
    dots_center = true
    fade_on_empty = false

    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(00000066)

    position = 0, -40
    halign = center
    valign = center
}

# ── caps-lock warning (Wayland-safe via hyprctl) ─────────────────────────────
label {
    monitor =
    text = cmd[update:1000] hyprctl devices -j 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); caps=[kb.get('capsLock',False) for kb in d.get('keyboards',[])] ; print('  CAPS LOCK ON' if any(caps) else '')" 2>/dev/null || echo ""
    color = rgba(f5c18af2)
    font_size = 11
    font_family = monospace
    position = 0, -104
    halign = center
    valign = center
}

# ── bottom hint ──────────────────────────────────────────────────────────────
label {
    monitor =
    text =   sea-shell
    color = rgba(6f809999)
    font_size = 11
    font_family = monospace
    position = 0, 28
    halign = center
    valign = bottom
}
