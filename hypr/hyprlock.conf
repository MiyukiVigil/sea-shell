# sea-shell — hyprlock (installed to ~/.config/hypr/hyprlock.conf)
# Locks via `loginctl lock-session` (hypridle relays it to hyprlock) or plain `hyprlock`.

general {
    hide_cursor = true
    grace = 2                      # seconds of mouse-wiggle forgiveness
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/.config/sea-shell/sea-wall.png
    color = rgba(13, 20, 32, 1.0)  # fallback when the wallpaper file is missing
    blur_passes = 3
    blur_size = 6
    vibrancy = 0.15
}

# big clock
label {
    monitor =
    text = cmd[update:1000] date +'%H:%M'
    color = rgba(226, 233, 244, 1.0)
    font_size = 84
    font_family = monospace
    position = 0, 140
    halign = center
    valign = center
}

# date under the clock
label {
    monitor =
    text = cmd[update:60000] date +'%A · %-d %B'
    color = rgba(166, 182, 207, 1.0)
    font_size = 16
    font_family = monospace
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 48
    rounding = 14
    outline_thickness = 2
    outer_color = rgba(99, 199, 221, 0.85)     # iris
    inner_color = rgba(13, 20, 32, 0.9)
    font_color = rgba(226, 233, 244, 1.0)
    check_color = rgba(162, 226, 232, 0.9)     # frost while verifying
    fail_color = rgba(243, 139, 168, 0.9)
    fail_text = <span foreground="##f38ba8">nope · try again ($ATTEMPTS)</span>
    placeholder_text = <span foreground="##6f8099">password…</span>
    dots_size = 0.25
    dots_spacing = 0.2
    fade_on_empty = false
    position = 0, -60
    halign = center
    valign = center
}

# hint at the bottom
label {
    monitor =
    text =    sea-shell · locked
    color = rgba(111, 128, 153, 1.0)
    font_size = 11
    font_family = monospace
    position = 0, 40
    halign = center
    valign = bottom
}
