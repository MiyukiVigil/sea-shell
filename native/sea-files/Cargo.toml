[package]
name = "sea-files"
version = "0.1.0"
edition = "2024"
description = "The sea-shell file manager"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_20"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
serde_json = "1"
md5 = "0.7"
zip = { version = "9", default-features = false, features = ["aes-crypto", "deflate", "bzip2", "zstd", "lzma"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
opt-level = 3
