[package]
name = "sea-panel"
version = "0.1.0"
edition = "2024"
description = "Laptop panel on/off for sea-shell (Hyprland hotplug + lid)"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
opt-level = 3
