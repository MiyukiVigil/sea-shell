[package]
name = "sea-gamepad"
version = "0.1.0"
edition = "2024"
description = "Controller reader for sea-shell Big Picture (evdev → JSON lines)"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
evdev = "0.13"
nix = { version = "0.29", default-features = false, features = ["poll"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
opt-level = 3
