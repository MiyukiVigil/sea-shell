[package]
name = "sea-appmenu"
version = "0.1.0"
edition = "2024"
description = "Focused-window global menu daemon for sea-shell (DBusMenu + AT-SPI fallback)"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
zvariant = "5"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
opt-level = 3
