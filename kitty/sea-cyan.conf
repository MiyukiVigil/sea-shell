# sea-shell — kitty theme, sea-cyan on a deep-ocean base (Catppuccin Mocha-derived)
# Include from kitty.conf:  include ~/Documents/personal/sea-shell/kitty/sea-cyan.conf

foreground              #e2e9f4
background              #0d1420
selection_foreground    #0d1420
selection_background    #63c7dd

cursor                  #63c7dd
cursor_text_color       #0d1420

url_color               #a2e2e8
active_border_color     #63c7dd
inactive_border_color   #24304a
bell_border_color       #f4c542

active_tab_foreground   #0d1420
active_tab_background    #63c7dd
inactive_tab_foreground #a6b6cf
inactive_tab_background  #161d2b

# black
color0  #1a2233
color8  #45526e
# red
color1  #f38ba8
color9  #f5a0b8
# green
color2  #a6e3a1
color10 #b9ebb4
# yellow
color3  #f4c542
color11 #f7d574
# blue
color4  #63c7dd
color12 #8ad7e8
# magenta
color5  #cba6f7
color13 #d9c1fa
# cyan
color6  #a2e2e8
color14 #bfeef2
# white
color7  #dfe7f2
color15 #ffffff

background_opacity      0.92
window_padding_width    10

# sea-shell matugen overrides — empty unless "match colours" is on in the control
# center; when on, this file holds a wallpaper-derived palette that overrides the
# defaults above. Regenerated by matugen-accent.sh; kept in ~/.config so the repo
# copy stays clean. (`include` of a missing/empty file is harmless.)
include ~/.config/sea-shell/kitty-matugen.conf

# sea-shell light-mode overrides — sea-apply-mode.sh fills this with a light palette
# (dark fonts on a light bg) when the shell is in light mode, and empties it for dark.
# Last include wins, so light mode overrides both the dark base and the matugen palette.
include ~/.config/sea-shell/kitty-mode.conf
