<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- sea-shell: what "sans-serif" and "monospace" mean for every app that does not pick its own
     font (kitty, GTK/Qt defaults, browsers' generic families). Installed to
     ~/.config/fontconfig/conf.d/, so a fonts.conf of your own still wins. -->
<fontconfig>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Inter</family><family>Noto Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer><family>JetBrains Mono</family><family>Noto Sans Mono</family></prefer>
  </alias>
  <!-- Inter's tabular figures and the disambiguated 1/l/I, so clocks and numbers do not jitter -->
  <match target="font">
    <test name="family"><string>Inter</string></test>
    <edit name="fontfeatures" mode="append"><string>tnum</string><string>cv05</string></edit>
  </match>
</fontconfig>
